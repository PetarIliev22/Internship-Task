<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product</title>
    <link rel="stylesheet" href="styles/productDetails.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>
<body>
    
    <div class="container d-flex flex-row justify-content-center">
        <a href="index.html" class="back-btn">← Back</a>

        <div class="product-wrapper row g-4">
            <div class="col-md-6">
                <img id="product-image" class="product-image" src="" alt="">
            </div>

            <div class="col-md-6">
                <div id="product-brand" class="brand"></div>
                <div id="product-title" class="title"></div>
                <div id="product-price" class="price"></div>
                <p id="product-description" class="desc"></p>

                <button class="btn-buy">Add to Cart</button>
            </div>

        </div>
    </div>

<script type="module" src="./scripts/Products/selectedProductDetails.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
