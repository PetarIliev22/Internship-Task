<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="styles/productDetails.css">
    <link rel="stylesheet" href="styles/style.css">
    <title>Product Details</title>
</head>

<body>
    <!-- TOP BAR -->
    <div class="top-bar container-fluid d-flex justify-content-around align-items-center p-1">
        <div class="contact-info d-flex flex-md-row flex-column gap-3">
            <a href="#" class="text-decoration-none"><i class="bi bi-envelope-at-fill"></i> chronos@watches.com</a>
        </div>

        <div class="social-icons d-flex gap-3">
            <a href="#"><i class="bi bi-facebook"></i></a>
            <a href="#"><i class="bi bi-twitter"></i></a>
            <a href="#"><i class="bi bi-instagram"></i></a>
        </div>
    </div>
    <!-- END TOP BAR -->
     
    <!-- Product Details -->
    <section class="container product-section p-0 p-md-1 h-100vh">
        <div class="container py-4" style="max-width: 1000px;">
            <div class="row g-4 bg-white rounded-3 p-3">
                <span onclick="history.back(); return false;" class="d-inline-flex align-items-center gap-2 text-muted small" style="cursor: pointer;"><i class="bi bi-arrow-left-circle-fill"></i>Back</span>

                <div class="col-md-5">
                    <img id="product-image" class="w-100 rounded-3 border mb-2">
                    <div id="product-thumbnails" class="d-flex gap-2 overflow-auto"></div>
                </div>

                <div class="col-md-7 d-flex flex-column justify-content-between">

                    <div>
                        <div class="d-flex justify-content-between mb-2">
                            <span id="product-category" class="badge bg-secondary text-uppercase">Category</span>
                            <span class="badge" id="product-status"></span>
                        </div>

                        <div id="product-brand" class="text-muted small fw-bold text-uppercase"></div>
                        <h2 id="product-title" class="fw-bold"></h2>

                        <span id="product-rating" class="text-warning small"></span>
                        <div class="mb-2" id="product-reviews">
                            <span id="product-price"></span>
                        </div>

                        <p id="product-description" class="text-secondary small"></p>

                        <div class="product-spec-list">
                            <h6 class="fw-bold text-uppercase text-muted small">Product Details</h6>
                            <ul id="product-specs" class="small text-muted p-2 m-2"></ul>
                        </div>

                    </div>

                    <div class="d-flex gap-2">
                        <input type="number" class="form-control text-center" value="1" min="1" max="10" style="max-width:80px">
                        <button class="btn btn-dark flex-grow-1"><i class="bi bi-cart-plus"></i> Add to Cart</button>
                    </div>

                </div>
            </div>
        </div>
    </section>
    <!-- END Product Details -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./scripts/Products/selectedProductDetails.js"></script>
</body>
</html>
